.logo-frame {
  width: 72px;
  height: 72px;
  position: relative;
  overflow: visible;

.logo-scale {
  width: 220px;

.head-base {
  position: relative;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background-color: #5500ff;
  overflow: hidden;

  transform: translateZ(0);

  -webkit-mask-image: radial-gradient(circle, #000 99.2%, transparent 100%);
          mask-image: radial-gradient(circle, #000 99.2%, transparent 100%);

  --track-x: 0;
  --track-y: 0;
  --track-scale-x: 1;
  --track-scale-y: 1;
}

.head-base:hover {
  transform: translateY(-8px) scale(1.02) translateZ(0);
  box-shadow:
    inset 0 0 0 1px rgba(85, 0, 255, 1),
    0 0 0 1px rgba(255, 255, 255, 0.4),
    0 45px 65px -15px rgba(85, 0, 255, 0.6);
  animation-play-state: paused;
}

.fluid-container {
  position: absolute;
  inset: 0;
  animation: texture-roll 10s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.head-base:hover .fluid-container {
  animation: none;
  transform: translate(calc(var(--track-x) * 18px), calc(var(--track-y) * 12px)) scale(1.02);
  transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.fluid {
  position: absolute;
  border-radius: 50%;
  filter: blur(40px);
  transition: all 0.5s ease;
}

.fluid-pink { width: 195px; height: 195px; background: #e82ae0; top: -35px; right: -25px; animation: flow-move 6s infinite alternate ease-in-out; }
.fluid-blue-deep { width: 180px; height: 180px; background: #1a4dff; bottom: -35px; left: -15px; animation: flow-move 9s infinite alternate ease-in-out; }
.fluid-cyan { width: 160px; height: 160px; background: #16b3ff; bottom: -20px; left: -25px; animation: flow-move 8s infinite alternate-reverse ease-in-out; }
.fluid-purple-glow { width: 180px; height: 180px; background: #a62eff; top: 20px; left: 20px; animation: flow-move-center 7s infinite alternate ease-in-out; }

             scaleX(var(--track-scale-x)) scaleY(var(--track-scale-y));

.eye {

  border-radius: 14px;

    0 0 15px rgba(255, 255, 255, 1),
    0 0 25px rgba(255, 255, 255, 0.6);
}

@keyframes gentle-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
@keyframes flow-move {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(15px, 20px) scale(1.1); }
}
@keyframes flow-move-center {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(-10px, 15px) scale(1.15); }
}
@keyframes spherical-roll {
  0%, 15% { transform: translate(0, 0) scale(1); }
  20%, 30% { transform: translate(-35px, -15px) scaleX(0.85) scaleY(0.95); }
  35%, 45% { transform: translate(30px, 15px) scaleX(0.88) scaleY(0.95); }
  50% { transform: translate(0, 0) scale(1); }
  53% { transform: translate(0, 35px) scaleY(0.75); }
  58%, 70% { transform: translate(0, 0) scale(1); }
  75%, 85% { transform: translate(15px, -5px) rotateZ(12deg) scaleX(0.95); }
  100% { transform: translate(0, 0) scale(1); }
}
@keyframes texture-roll {
  0%, 15% { transform: translate(0, 0); }
  20%, 30% { transform: translate(-18px, -8px); }
  35%, 45% { transform: translate(15px, 8px); }
  50% { transform: translate(0, 0); }
  53% { transform: translate(0, 18px); }
  58%, 70% { transform: translate(0, 0); }
  75%, 85% { transform: translate(8px, -2px) rotateZ(6deg); }
  100% { transform: translate(0, 0); }
}

@keyframes smart-blink {
  0%, 45%, 53%, 100% { transform: scaleY(1); }
  48% { transform: scaleY(0.05); }
  50% { transform: scaleY(1); }
  51% { transform: scaleY(0.05); }

@keyframes intro-blink {

  68%  { transform: scaleY(0.08); }

<script>
/* ===================================================== */
/* AI助手logo-72px🚩.html 的 LOGO JS（完整原样保留，单引号转双引号） */
/* ===================================================== */
const logo = document.getElementById("ai-logo");

logo.addEventListener("mousemove", (e) => {
  const rect = logo.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  const y = ((e.clientY - rect.top) / rect.height) * 2 - 1;

  const dist = Math.sqrt(x * x + y * y);
  const clampedDist = Math.min(1, dist);

  const scaleX = 1 - (clampedDist * 0.15);
  const scaleY = 1 - (clampedDist * 0.10);

  logo.style.setProperty("--track-x", x);
  logo.style.setProperty("--track-y", y);
  logo.style.setProperty("--track-scale-x", scaleX);
  logo.style.setProperty("--track-scale-y", scaleY);
});

logo.addEventListener("mouseleave", () => {
  logo.style.setProperty("--track-x", 0);
  logo.style.setProperty("--track-y", 0);
  logo.style.setProperty("--track-scale-x", 1);
  logo.style.setProperty("--track-scale-y", 1);
});

window.addEventListener("load", () => {
  const eyes = document.querySelectorAll(".eye");

  const startDelay = 260;
  const blinkDur = 1150;

  setTimeout(() => {
    eyes.forEach((eye) => {
      eye.style.animation = `intro-blink ${blinkDur}ms ease-in-out 1`;
    });

    setTimeout(() => {
      eyes.forEach((eye) => {
        eye.style.animation = "smart-blink 6s infinite";
      });
    }, blinkDur + 20);
  }, startDelay);
});

/* =========================== */
/* AI助手-打字-02 原始JS逻辑 */
/* =========================== */
  const content = "有什么我能帮你的吗？";
  const textEl = document.getElementById("text");

  const typingSpeed = 150;
  const totalCycle = 5000; // 5秒循环

  function startTyping() {

    let index = 0;

    const startTime = Date.now();

    function type() {

      if (index <= content.length) {
        textEl.innerHTML = content.substring(0, index);
        index++;
        setTimeout(type, typingSpeed);
      } else {

        const elapsed = Date.now() - startTime;
        const remaining = Math.max(totalCycle - elapsed, 0);

        setTimeout(() => {
          textEl.innerHTML = "";
          startTyping();
        }, remaining);

      }

    }

    type();

  }

  startTyping();

</script>
